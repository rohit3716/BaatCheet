<!-- Save as baatcheet-logo.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="BaatCheet logo">
  <!-- Background (optional) -->
  <rect width="100%" height="100%" rx="20" ry="20" fill="#F7F3EC"/>

  <!-- Speech bubble -->
  <g transform="translate(16,20)">
    <path d="M16 12h152a20 20 0 0 1 20 20v72a20 20 0 0 1-20 20H88l-24 24v-24H16a20 20 0 0 1-20-20V32A20 20 0 0 1 16 12z"
          fill="#ffffff" stroke="#0B2540" stroke-width="4" stroke-linejoin="round"/>

    <!-- Divider line between two people (subtle) -->
    <rect x="92" y="36" width="2" height="76" rx="1" fill="#0B2540" opacity="0.06"/>

    <!-- Left person (orange) -->
    <g transform="translate(28,36)">
      <!-- head -->
      <circle cx="20" cy="12" r="10" fill="#FF8A65" stroke="#0B2540" stroke-width="3"/>
      <!-- body -->
      <path d="M6 36c0-8 6-15 14-15s14 7 14 15v6H6v-6z" fill="#FF8A65" stroke="#0B2540" stroke-width="3" stroke-linejoin="round"/>
    </g>

    <!-- Right person (light blue) -->
    <g transform="translate(108,36)">
      <!-- head -->
      <circle cx="20" cy="12" r="10" fill="#6EC6FF" stroke="#0B2540" stroke-width="3"/>
      <!-- body -->
      <path d="M6 36c0-8 6-15 14-15s14 7 14 15v6H6v-6z" fill="#6EC6FF" stroke="#0B2540" stroke-width="3" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Brand name -->
  <text x="120" y="210" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial"
        font-size="28" font-weight="700" text-anchor="middle" fill="#0B2540">BaatCheet</text>
</svg>
